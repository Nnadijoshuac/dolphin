# Verifies the Next.js website (web/) on Linux, on every push.
#
# ---------------------------------------------------------------------------
# THE SITE IS DEPLOYED. THIS WORKFLOW IS NOT WHAT DEPLOYS IT.
# ---------------------------------------------------------------------------
# https://dolphinamp.vercel.app is the live website, published by VERCEL'S OWN
# GIT INTEGRATION - Vercel watches this repository directly and builds `web/`
# on every push, with no workflow, no token and no step in this file involved.
# Production tracks `main`; every other branch and pull request gets its own
# Vercel preview URL.
#
# This header previously claimed the opposite ("a live URL for this site needs
# a hosting decision only the repo owner can make") and listed Vercel as an
# unexplored option. That was written before the Vercel project existed and was
# never corrected, so the repository's own CI documentation asserted the site
# was unshipped while it was serving traffic. Reading these workflows is how
# someone new answers "where does this go", and a stale answer here is worse
# than none: a 2026-09-08 review of this repo concluded from this very comment
# that the website had no public URL. Corrected here; see web/README.md for the
# deployment contract in full.
#
# WHAT DOES DEPLOY THE OTHER FRONTEND. deploy-web.yml publishes the EXPO web
# export (the React Native app rendered through react-native-web) to this
# repository's single GitHub Pages site. That is a different product from this
# one and the two do not share a host, which is the whole reason the Pages slot
# never had to be contested.
#
# ---------------------------------------------------------------------------
# SO WHAT IS THIS JOB FOR
# ---------------------------------------------------------------------------
# Vercel builds `web/` and nothing else. It does not run `tsc --noEmit`, it does
# not run eslint, and a Vercel build that fails is a deploy that silently keeps
# serving the previous version. This job is the gate Vercel does not provide:
# typecheck, lint, and a clean-install build on Linux, reported on the pull
# request BEFORE the merge that would promote it. Its first run immediately
# caught two things that only show up on a clean Linux checkout - the lockfile
# defect and the missing generated route types - both documented at their steps
# below.
#
# Keep the env block below in step with the Vercel project's own environment
# variables. They are two separate configurations of the same values, and the
# failure mode when they drift is that CI passes against one Convex deployment
# while production serves another.
name: Verify website (web/)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/build-web-site.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # A public client identifier, not a secret - Next inlines every
      # NEXT_PUBLIC_* value into the browser bundle by design, and this URL is
      # already readable in any shipped build. It must point at the SAME Convex
      # deployment the mobile app uses; that is what makes the two surfaces
      # show identical data. The one real secret in this project
      # (SCAN8004_API_KEY) is Convex-side only and is never referenced here.
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL || 'https://greedy-aardvark-200.eu-west-1.convex.cloud' }}
      NEXT_PUBLIC_BSC_RPC_URL: ${{ vars.NEXT_PUBLIC_BSC_RPC_URL }}
    steps:
      - uses: actions/checkout@v4

      # Node 24 to match the toolchain both projects were verified against
      # locally, and the one deploy-web.yml already pins.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` first, and the first CI run answered the open question: web/'s
      # lockfile HAS the same defect as the root one. Run 33250109899 emitted
      #
      #   npm error code EUSAGE
      #   npm error Missing: @emnapi/runtime@1.11.3 from lock file
      #   npm error Missing: @emnapi/core@1.11.3 from lock file
      #
      # which is character-for-character the failure deploy-web.yml diagnoses at
      # length: npm records an optional platform-specific package's own
      # dependencies only for the platform it resolved on, and both lockfiles
      # here were authored on Windows. So both projects need the fallback, and
      # the durable fix for both is to regenerate the lockfiles once on Linux.
      #
      # `npm ci` is still attempted first so this stops falling back the moment
      # that happens, and the annotation keeps the reason visible - annotations
      # being how the root project's failure was diagnosed, since raw job logs
      # need an authenticated download.
      - name: Install dependencies
        run: |
          set -o pipefail
          if npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log; then
            echo "installed with npm ci"
          else
            reason=$(grep -iE "npm (error|ERR!)" /tmp/npm-ci.log | head -n 10 | tr '\n' '~')
            echo "::warning title=npm ci failed, fell back to npm install::${reason:-see job log}"
            npm install --no-audit --no-fund
          fi

      # Next 16 generates the global route types (LayoutProps, PageProps) into
      # .next/types, and .next is not committed - so on a clean clone
      # `tsc --noEmit` fails with "Cannot find name 'LayoutProps'" before
      # anything has built. The first CI run failed exactly there. `next typegen`
      # emits those types without a full build, which is what it is for.
      - name: Generate route types
        run: npx next typegen

      # FIRST, because it is the only step here that can catch the failure mode
      # that has actually taken this site down. web/src/convex/api.ts describes
      # the backend by hand, so `tsc` type-checks the site against that
      # description rather than against Convex - and on 2026-09-06 the
      # description drifted, tsc passed, and every hire on the live site failed
      # in the browser with ArgumentValidationError. This parses the real
      # convex/*.ts modules and compares them. It caught a genuine gap on its
      # first run (an indexed `protocol` filter the site never declared).
      #
      # It reads ../convex, so it is the one step here that depends on the
      # repository rather than only on web/.
      - name: Check Convex API declarations match the backend
        run: npm run check:convex-api

      # Typecheck separately from the build so a type error is reported as a
      # type error, rather than as a generic build failure 60 seconds later.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # Pure-logic tests over the units that have actually broken here: the
      # category label that was wrong for eight of thirteen categories, the
      # reputation-registry write path that spends real BNB, and the analytics
      # vocabulary's privacy properties. No component rendering - what breaks on
      # this site is never JSX.
      - name: Test
        run: npm run test

      - name: Build
        run: npx next build

      # Kept so a future deploy step has something to publish, and so a failed
      # deploy can be told apart from a failed build.
      - uses: actions/upload-artifact@v4
        with:
          name: web-next-build
          path: |
            web/.next
            !web/.next/cache
          retention-days: 7
